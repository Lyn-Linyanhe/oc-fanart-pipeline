<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>二创比对</title>
  <style>
    :root { --bg:#101218; --card:#1a1e28; --line:#2c3344; --text:#e8eaed; --muted:#9aa3b2; --pin:#e11d48; --ok:#34d399; --warn:#fbbf24; }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    header { padding:16px 20px; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 6px; font-size:18px; }
    .hint { color:var(--muted); font-size:13px; }
    .meta { margin-top:6px; font-size:12px; color:var(--muted); }
    .dock { padding:14px 20px; border-bottom:1px solid var(--line); background:#141820; }
    .row-form { display:grid; grid-template-columns: 1fr 1fr 180px; gap:12px; align-items:end; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
    textarea, select { width:100%; background:#0c0e13; border:1px solid var(--line); border-radius:8px; padding:8px; }
    textarea { min-height:72px; resize:vertical; }
    .go { width:100%; background:#9f1239; border:0; border-radius:8px; color:#fff; padding:14px 8px; font-weight:650; }
    .go:disabled { opacity:.5; cursor:not-allowed; }
    .check { display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--muted); margin-top:8px; }
    .qrow { margin-top:10px; }
    .qrow select { height:32px; }
    .film { display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; }
    .chip { flex:0 0 auto; width:76px; padding:0; border:2px solid transparent; background:#0c0e13; border-radius:8px; overflow:hidden; }
    .chip img, .chip .ph { width:76px; height:76px; object-fit:cover; display:block; background:#000; }
    .chip .ph { color:var(--muted); font-size:11px; display:flex; align-items:center; justify-content:center; }
    .chip .lbl { font-size:11px; color:var(--muted); padding:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chip.active { border-color:#38bdf8; }
    .chip .vbadge { position:absolute; top:4px; left:4px; font-size:10px; padding:1px 4px; border-radius:4px; background:#0c0e13cc; color:#e8eaed; }
    .chip { position:relative; }
    .chip.bad img { opacity:.42; }
    .chip.untouched img { filter:grayscale(.75) brightness(.85); }
    .bigview { display:none; grid-column:1 / -1; margin-top:8px; background:#0c0e13; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    .bigview.show { display:block; }
    .bigview img { width:100%; max-height:70vh; object-fit:contain; background:#0b0d12; border-radius:8px; display:block; }
    .bigview .cap { color:var(--muted); font-size:12px; margin-top:8px; word-break:break-all; }
    .filters { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px; }
    .filters button { background:#0c0e13; border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; color:var(--muted); }
    .filters button.on { border-color:#38bdf8; color:var(--text); }
    .inspire-split { display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:14px; align-items:start; }
    .inspire-left { min-width:0; }
    .vpanel { background:#0c0e13; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12.5px; }
    .vpanel h3 { margin:0 0 8px; font-size:12px; color:var(--muted); font-weight:600; }
    .vpanel dl { display:grid; grid-template-columns:76px 1fr; gap:4px 10px; margin:0; max-height:360px; overflow:auto; }
    .vpanel dt { color:var(--muted); }
    .vpanel dd { margin:0; }
    .vpanel ul { margin:0; padding-left:16px; }
    .vpanel .thumb { width:100%; max-height:170px; object-fit:contain; background:#0b0d12; border-radius:8px; margin-bottom:8px; display:block; }
    .vempty { color:var(--muted); font-size:12.5px; }
    .grid { display:flex; flex-direction:column; gap:28px; padding:20px; max-width:1400px; margin:0 auto; }
    .row { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
    .row h2 { margin:0 0 10px; font-size:15px; font-weight:650; }
    .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    figure { margin:0; }
    figure img { width:100%; height:420px; object-fit:contain; background:#0b0d12; border-radius:8px; }
    figcaption { color:var(--muted); font-size:12px; margin-top:6px; }
    .missing { height:420px; display:flex; align-items:center; justify-content:center; color:var(--muted); background:#0b0d12; border-radius:8px; }
    .jobmeta { color:var(--muted); font-size:12px; margin-top:8px; }
    .ok { color:var(--ok); }
    .fail { color:#fb7185; }
    .run { color:var(--warn); }
    .tabs { display:flex; gap:8px; padding:12px 20px 0; max-width:1400px; margin:0 auto; }
    .tabs button { background:#0c0e13; border:1px solid var(--line); border-radius:8px 8px 0 0; padding:8px 16px; font-size:13px; color:var(--muted); }
    .tabs button.on { background:var(--card); border-bottom-color:var(--card); color:var(--text); }
    .view { display:none; }
    .view.on { display:block; }
    .rbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:0 20px 10px; max-width:1400px; margin:0 auto; }
    .rbar button { background:#0c0e13; border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; color:var(--muted); }
    .rbar button.on { border-color:#38bdf8; color:var(--text); }
    .row .acts { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
    .row .acts button { border:1px solid var(--line); background:#0c0e13; border-radius:8px; padding:6px 12px; font-size:12.5px; }
    .row .acts button.sel-pass { border-color:var(--ok); color:var(--ok); }
    .row .acts button.sel-manual { border-color:var(--warn); color:var(--warn); }
    .row .acts button.sel-quarantine { border-color:#fb7185; color:#fb7185; }
    .badge { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
    .badge.pass { border-color:var(--ok); color:var(--ok); }
    .badge.manual_review { border-color:var(--warn); color:var(--warn); }
    .badge.quarantine { border-color:#fb7185; color:#fb7185; }
    .empty { padding:40px 20px; color:var(--muted); text-align:center; }
    .redo-bar { display:none; margin:0 20px 8px; padding:8px 12px; border:1px solid #38bdf8; border-radius:8px; background:#0c0e13; color:#7dd3fc; font-size:12.5px; }
    .redo-bar.show { display:block; }
    .acts button.redo { border-color:#38bdf8; color:#7dd3fc; }
    /* single-image pager */
    .pager { max-width:1400px; margin:0 auto; padding:0 20px 20px; }
    .phead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
    .phead .title { font-size:17px; font-weight:650; }
    .phead .nav { display:flex; gap:6px; align-items:center; margin-left:auto; }
    .phead .nav button { border:1px solid var(--line); background:#0c0e13; border-radius:8px; padding:6px 14px; font-size:13px; }
    .phead .nav button:disabled { opacity:.4; cursor:not-allowed; }
    .phead .nav .pos { color:var(--muted); font-size:12.5px; min-width:76px; text-align:center; }
    .pcard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .pimgs { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .pimgs figure img { height:min(60vh,600px); }
    .pinfo { color:var(--muted); font-size:12.5px; margin-top:12px; }
    .pact { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
    .pact button { border:1px solid var(--line); background:#0c0e13; border-radius:8px; padding:7px 14px; font-size:13px; }
    .pact button.sel-pass { border-color:var(--ok); color:var(--ok); }
    .pact button.sel-manual { border-color:var(--warn); color:var(--warn); }
    .pact button.sel-quarantine { border-color:#fb7185; color:#fb7185; }
    .pact button.redo { border-color:#38bdf8; color:#7dd3fc; }
    .promptbox { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
    .promptbox h3 { margin:0 0 8px; font-size:12.5px; color:var(--muted); font-weight:600; }
    .promptbox textarea { min-height:112px; font-size:12.5px; line-height:1.5; }
    .promptbox textarea.neg { min-height:70px; }
    .promptbox .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
    .promptbox .btnrow { display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap; }
    .promptbox .btnrow .hint { font-size:12px; }
    .promptbox .refnote { font-size:12px; color:#7dd3fc; margin-top:6px; }
  </style>
</head>
<body>
  <header>
    <h1>二创比对</h1>
    <div class="hint">左：别的 IP 构图灵感。右：用身份锁图生成的新图。每生成一张就多一行。</div>
    <div class="meta" id="meta">读取本机配置…</div>
  </header>
  <section class="dock">
    <div class="hint">身份</div>
    <div class="film" id="chars"></div>
    <div class="hint" style="margin-top:10px">构图（默认排除当前角色自己的动画）</div>
    <div class="filters" id="vfilters"></div>
    <div class="inspire-split">
      <div class="inspire-left">
        <div class="film" style="padding-top:0">
          <select id="seriesFilter" style="flex:0 0 160px;align-self:center;height:36px"></select>
          <div id="insps" class="film" style="padding:0;flex:1"></div>
        </div>
      </div>
      <div class="vpanel" id="vpanel"></div>
    </div>
    <div class="bigview" id="bigview"></div>
    <div class="redo-bar" id="redoBar"></div>
    <form id="form" class="row-form" style="margin-top:12px">
      <div>
        <label>姿态 / 镜头</label>
        <textarea id="pose" placeholder="双手在胸前捧玩偶，中景"></textarea>
      </div>
      <div>
        <label>画风 / 光色</label>
        <textarea id="style" placeholder="水彩薄涂、冷色窗光"></textarea>
      </div>
      <div>
        <button class="go" id="btnGo" type="submit">生成</button>
        <label class="check"><input type="checkbox" id="sendInspire" checked /> 连灵感图一起送（默认开启；提示词已声明它只借构图/画风，不抄脸）</label>
        <div class="qrow">
          <label>尺寸</label>
          <select id="sizeSel"></select>
          <label style="margin-top:8px">质量</label>
          <select id="quality">
            <option value="low">low（最快，草稿）</option>
            <option value="medium">medium</option>
            <option value="high" selected>high（默认，噪点更少）</option>
          </select>
        </div>
      </div>
    </form>
  </section>
  <div class="tabs">
    <button type="button" id="tabResults" class="on">生成结果 · 审核</button>
    <button type="button" id="tabJobs">本次生成记录</button>
  </div>
  <div class="view on" id="viewResults">
    <div class="rbar" id="rbar"></div>
    <div class="pager" id="pager"></div>
  </div>
  <div class="view" id="viewJobs">
    <main class="grid" id="grid"></main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { characters: [], inspire: [], series: [], jobs: [], character: "", inspirePath: "", vision: "all", counts: {}, picked: null, results: [], rcounts: {}, rstatus: "all", redoOf: "", pageIndex: 0, sizePresets: {}, defaultSize: "" };
    const VFILTERS = [
      ["all", "全部"],
      ["usable", "可用"],
      ["person", "有人物"],
      ["no_person", "无人物"],
      ["text", "文字卡"],
      ["maybe", "待复核"],
      ["todo", "未筛"],
    ];

    function fileUrl(path, thumb) {
      return (thumb ? "/api/thumb?path=" : "/api/file?path=") + encodeURIComponent(path);
    }
    function currentChar() {
      return state.characters.find((c) => c.id === state.character);
    }
    function fig(path, caption) {
      if (!path) return `<div class="missing">${caption}缺失 / 生成中</div><figcaption>${caption}</figcaption>`;
      return `<img src="${fileUrl(path, false)}" alt="${caption}" /><figcaption>${caption}</figcaption>`;
    }
    function renderChars() {
      $("chars").innerHTML = state.characters.map((c) => `
        <button type="button" class="chip ${c.id === state.character ? "active" : ""}" data-id="${c.id}">
          ${c.has_ref ? `<img src="${fileUrl(c.ref_path, true)}" alt="" />` : `<div class="ph">无锁图</div>`}
          <div class="lbl">${c.name}</div>
        </button>`).join("");
      $("chars").querySelectorAll(".chip").forEach((el) => {
        el.onclick = () => { state.character = el.dataset.id; renderChars(); loadInspire(); };
      });
    }
    function renderFilters() {
      $("vfilters").innerHTML = VFILTERS.map(([key, label]) => {
        const n = state.counts[key];
        const txt = (n === undefined ? label : `${label} ${n}`);
        return `<button type="button" class="${state.vision === key ? "on" : ""}" data-v="${key}">${txt}</button>`;
      }).join("");
      $("vfilters").querySelectorAll("button").forEach((el) => {
        el.onclick = () => { state.vision = el.dataset.v; loadInspire(); };
      });
    }
    function chipClass(it) {
      const v = it.vision || {};
      if (!v.done) return "untouched";
      if (v.contains_person === false || v.usable === false) return "bad";
      return "";
    }
    function chipBadge(it) {
      const v = it.vision || {};
      if (!v.done) return "未筛";
      if (v.contains_large_text) return "文字";
      if (v.contains_person === false) return "无人";
      if (v.usable === false) return "待定";
      return "";
    }
    function renderInspire() {
      const sel = $("seriesFilter");
      const cur = sel.value;
      sel.innerHTML = `<option value="">全部其他动画</option>` + state.series.map((s) => `<option value="${s}">${s}</option>`).join("");
      if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
      $("insps").innerHTML = state.inspire.map((it) => {
        const badge = chipBadge(it);
        return `
        <button type="button" class="chip ${chipClass(it)} ${it.path === state.inspirePath ? "active" : ""}" data-path="${it.path.replace(/"/g, "")}">
          ${badge ? `<span class="vbadge">${badge}</span>` : ""}
          <img src="${fileUrl(it.path, true)}" alt="" />
          <div class="lbl">${it.vision && it.vision.done ? (it.vision.shot || it.series) : it.series}</div>
        </button>`;
      }).join("");
      $("insps").querySelectorAll(".chip").forEach((el) => {
        el.onclick = () => pickInspire(el.dataset.path);
      });
    }
    function renderBigView() {
      const box = $("bigview");
      const it = state.picked;
      if (!it) { box.classList.remove("show"); box.innerHTML = ""; return; }
      const v = it.vision || {};
      const parts = [];
      if (v.done) {
        const bits = [v.shot, v.action, v.expression, v.scene].filter(Boolean);
        if (bits.length) parts.push(bits.join(" · "));
      } else {
        parts.push("这张还没做视觉筛选");
      }
      const sw = v.split_wide;
      if (sw && sw.is_split_wide !== null && sw.is_split_wide !== undefined) {
        parts.push(sw.is_split_wide ? `宽图对：是（${sw.confidence ?? "-"}）` : `宽图对：否（${sw.confidence ?? "-"}）`);
      }
      box.innerHTML = `<img src="${fileUrl(it.path, false)}" alt="" />
        <div class="cap">${it.file || ""}${parts.length ? " — " + parts.join("；") : ""}</div>`;
      box.classList.add("show");
    }
    function renderVisionPanel() {
      const p = $("vpanel");
      const it = state.picked;
      const v = it && it.vision;
      if (!it) {
        p.innerHTML = `<h3>构图详情</h3><div class="vempty">点上方任意一张构图，这里显示它的视觉筛选结果。</div>`;
        return;
      }
      if (!v || !v.done) {
        p.innerHTML = `<h3>构图详情</h3>
          <img class="thumb" src="${fileUrl(it.path, true)}" alt="" />
          <div class="vempty">这张还没做视觉筛选。跑过 vision_screen.py 之后这里会显示景别、动作、表情、场景等描述。</div>`;
        return;
      }
      const row = (k, val) => (val === null || val === undefined || val === "") ? "" : `<dt>${k}</dt><dd>${String(val)}</dd>`;
      const list = (k, arr) => (arr && arr.length) ? `<dt>${k}</dt><dd><ul>${arr.map((x) => `<li>${x}</li>`).join("")}</ul></dd>` : "";
      const sw = v.split_wide;
      const swText = sw && sw.is_split_wide !== null && sw.is_split_wide !== undefined
        ? (sw.is_split_wide ? `是（置信度 ${sw.confidence ?? "-"}）` : `否（置信度 ${sw.confidence ?? "-"}）`)
        : "";
      p.innerHTML = `<h3>视觉筛选（${v.note_id || ""}）</h3>
        <img class="thumb" src="${fileUrl(it.path, false)}" alt="" />
        <dl>
        ${row("可用", v.usable)}
        ${row("人物数", v.character_count)}
        ${row("景别机位", v.shot)}
        ${row("动作", v.action)}
        ${row("表情", v.expression)}
        ${row("场景", v.scene)}
        ${row("光线色彩", v.lighting_and_palette)}
        ${row("宽图对", swText)}
        ${list("装饰道具", v.decorations)}
        ${list("可见事实", v.visible_facts)}
        ${list("推测", v.interpretations)}
        ${row("判断依据", v.reason)}
      </dl>`;
    }
    function renderJobs() {
      const jobs = [...state.jobs].reverse();
      if (!jobs.length) {
        $("grid").innerHTML = `<section class="row"><h2>还没有生成</h2><div class="hint">选身份和构图，填姿态/画风后点生成。每张会在这里左右并排。</div></section>`;
        return;
      }
      $("grid").innerHTML = jobs.map((j) => {
        const st = j.status === "ok" ? "ok" : j.status === "fail" ? "fail" : "run";
        const title = `${j.id} · ${j.status}${j.sec ? " · " + j.sec + "s" : ""}`;
        return `<section class="row">
          <h2>${title}</h2>
          <div class="pair">
            <figure>${fig(j.left || j.inspire, "灵感（别的 IP）")}</figure>
            <figure>${fig(j.right, "新图（身份锁图）")}</figure>
          </div>
          <div class="jobmeta ${st}">${(j.error || j.pose || j.style || "").slice(0, 160)}</div>
        </section>`;
      }).join("");
    }
    async function pickInspire(path) {
      state.inspirePath = path;
      state.picked = state.inspire.find((it) => it.path === path) || null;
      renderInspire();
      renderVisionPanel();
      renderBigView();
      try {
        const r = await fetch("/api/draft?path=" + encodeURIComponent(path));
        const j = await r.json();
        if (!j.ok) return;
        if (!$("pose").value.trim()) $("pose").value = [j.shot, j.pose].filter(Boolean).join("，");
        if (!$("style").value.trim()) $("style").value = j.style || "";
      } catch {}
    }
    async function loadState() {
      const r = await fetch("/api/state");
      const j = await r.json();
      state.characters = j.characters || [];
      state.jobs = j.jobs || [];
      if (!state.character && state.characters.length) {
        state.character = (state.characters.find((c) => c.has_ref) || state.characters[0]).id;
      }
      const s = j.settings || {};
      state.sizePresets = s.size_presets || {};
      state.defaultSize = s.size || "";
      $("meta").textContent = s.has_key ? `${s.model} · ${s.size} · ${s.quality}` : (s.error || "没有 API Key");
      renderSizeOptions();
      renderChars();
      renderJobs();
      renderResults();
    }
    const RSTATUS = [
      ["all", "全部"],
      ["unreviewed", "未审"],
      ["pass", "通过"],
      ["manual_review", "待复核"],
      ["quarantine", "垃圾篓"],
    ];
    const RLABEL = { unreviewed: "未审", pass: "通过", manual_review: "待复核", quarantine: "垃圾篓" };
    function renderSizeOptions() {
      const sel = $("sizeSel");
      const presets = state.sizePresets || {};
      const keys = Object.keys(presets);
      if (!keys.length) {
        sel.innerHTML = `<option value="1024x1536">2:3（1024x1536）</option>`;
        return;
      }
      sel.innerHTML = keys.map((k) => {
        const v = presets[k];
        return `<option value="${v}">${k === "auto" ? "auto（按内容判断）" : k + "（" + v + "）"}</option>`;
      }).join("");
      const current = state.defaultSize || "1024x1536";
      if ([...sel.options].some((o) => o.value === current)) sel.value = current;
      else sel.value = presets["2:3"] || sel.options[0].value;
    }
    function renderRBar() {
      $("rbar").innerHTML = RSTATUS.map(([k, label]) => {
        const n = state.rcounts[k];
        return `<button type="button" class="${state.rstatus === k ? "on" : ""}" data-r="${k}">${label}${n === undefined ? "" : " " + n}</button>`;
      }).join("");
      $("rbar").querySelectorAll("button").forEach((el) => {
        el.onclick = () => { state.rstatus = el.dataset.r; loadResults(); };
      });
    }
    function renderResults() {
      renderRBar();
      const items = state.results || [];
      if (!items.length) {
        $("pager").innerHTML = `<div class="empty">还没有生成结果。在下方生成区跑一张，或换个筛选看看。</div>`;
        return;
      }
      if (state.pageIndex >= items.length) state.pageIndex = items.length - 1;
      if (state.pageIndex < 0) state.pageIndex = 0;
      const it = items[state.pageIndex];
      const st = (it.review && it.review.status) || "unreviewed";
      const rid = it.result_id;
      const meta = [it.series, it.character, it.folder, it.id].filter(Boolean).join(" · ");
      const sub = [it.shot, it.pose, it.style].filter(Boolean).join("，");
      const canPrev = state.pageIndex > 0;
      const canNext = state.pageIndex < items.length - 1;
      $("pager").innerHTML = `
        <div class="phead">
          <span class="title">${it.id}</span>
          <span class="badge ${st}">${RLABEL[st] || st}</span>
          <div class="nav">
            <button type="button" id="pPrev" ${canPrev ? "" : "disabled"}>← 上一张</button>
            <span class="pos">${state.pageIndex + 1} / ${items.length}</span>
            <button type="button" id="pNext" ${canNext ? "" : "disabled"}>下一张 →</button>
          </div>
        </div>
        <div class="pcard">
          <div class="pimgs">
            <figure>${fig(it.inspire, "灵感（别的 IP）")}</figure>
            <figure>${fig(it.path, "生成（身份锁图）")}</figure>
          </div>
          <div class="pinfo">${meta}${it.sec ? " · " + it.sec + "s" : ""}${it.has_params ? "" : " · 这张生成时未记录提示词"}</div>
          <div class="promptbox">
            <h3>完整提示词（直接改，改什么就发什么）</h3>
            <textarea id="pPrompt" spellcheck="false">${esc(it.prompt_preview || sub || "")}</textarea>
            <div class="grid2">
              <div>
                <h3>负向提示词</h3>
                <textarea id="pNeg" class="neg" spellcheck="false">${esc(it.negative_preview || "")}</textarea>
              </div>
              <div>
                <h3>本次参数（点重新生成会带进去）</h3>
                <textarea id="pParams" class="neg" spellcheck="false">${esc(sub)}</textarea>
                <div class="refnote">${it.inspire ? "参考图：默认随请求一起送（第二张，只借构图/画风）" : "没有灵感图，本次只锁身份"}</div>
              </div>
            </div>
            <div class="btnrow">
              <button type="button" id="pRefresh">按参数刷新提示词</button>
              <button type="button" id="pGo" class="redo">用这个提示词重新生成</button>
              <label class="hint">尺寸
                <select id="pSize"></select>
              </label>
              <label class="hint">质量
                <select id="pQuality">
                  <option value="low">low</option>
                  <option value="medium">medium</option>
                  <option value="high" selected>high</option>
                </select>
              </label>
              <span class="hint">重新生成会新建一张，原图保留</span>
            </div>
          </div>
          <div class="pact">
            <button type="button" data-act="pass" data-rid="${rid}" class="${st === "pass" ? "sel-pass" : ""}">通过</button>
            <button type="button" data-act="manual_review" data-rid="${rid}" class="${st === "manual_review" ? "sel-manual" : ""}">待复核</button>
            <button type="button" data-act="quarantine" data-rid="${rid}" class="${st === "quarantine" ? "sel-quarantine" : ""}">丢垃圾篓</button>
            <button type="button" data-act="unreviewed" data-rid="${rid}">取消标记</button>
          </div>
        </div>`;
      $("pPrev").onclick = () => { state.pageIndex--; renderResults(); };
      $("pNext").onclick = () => { state.pageIndex++; renderResults(); };
      $("pRefresh").onclick = () => refreshPrompt(it);
      $("pGo").onclick = () => redoWithPrompt(it);
      const pSize = $("pSize");
      const presets = state.sizePresets || {};
      pSize.innerHTML = Object.keys(presets).map((k) => {
        const v = presets[k];
        return `<option value="${v}">${k === "auto" ? "auto" : k}</option>`;
      }).join("") || `<option value="1024x1536">2:3</option>`;
      if ([...pSize.options].some((o) => o.value === state.defaultSize)) pSize.value = state.defaultSize;
      $("pager").querySelectorAll("button[data-act]").forEach((el) => {
        el.onclick = () => setReview(el.dataset.rid, el.dataset.act);
      });
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    async function refreshPrompt(it) {
      const params = $("pParams").value.trim();
      const cid = it.char_id || state.character;
      if (!cid) { alert("缺少角色 id"); return; }
      const url = "/api/prompt?character=" + encodeURIComponent(cid)
        + "&shot=" + encodeURIComponent(params)
        + "&pose=" + encodeURIComponent("")
        + "&style=" + encodeURIComponent("")
        + "&send_inspire=" + (it.inspire ? "1" : "0");
      const r = await fetch(url);
      const j = await r.json();
      if (!j.ok) { alert(j.error || "生成提示词失败"); return; }
      $("pPrompt").value = j.prompt;
      $("pNeg").value = j.negative;
    }
    async function redoWithPrompt(it) {
      const cid = it.char_id;
      if (!cid) { alert("这张图对应的角色没在流水线里登记，请先在下方手动选角色。"); return; }
      const prompt = $("pPrompt").value.trim();
      const neg = $("pNeg").value.trim();
      const params = $("pParams").value.trim();
      if (!prompt) { alert("提示词不能为空"); return; }
      const btn = $("pGo");
      btn.disabled = true;
      btn.textContent = "提交中…";
      try {
        const r = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            character: cid,
            shot: params, pose: "", style: "",
            inspire: it.inspire || "",
            send_inspire: !!it.inspire,
            prompt_override: prompt,
            negative_override: neg,
            quality: ($("pQuality") || {}).value || "high",
            size: ($("pSize") || {}).value || "",
            redo_of: it.id,
          }),
        });
        const j = await r.json();
        if (!j.ok) { alert(j.error || "提交失败"); return; }
        $("redoBar").classList.add("show");
        $("redoBar").textContent = `已提交重做：${it.id} → 新图会作为新的一张出现，原图保留`;
      } finally {
        btn.disabled = false;
        btn.textContent = "用这个提示词重新生成";
      }
    }
    async function setReview(resultId, status) {
      const r = await fetch("/api/review", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ result_id: resultId, status }),
      });
      const j = await r.json();
      if (!j.ok) { alert(j.error || "标记失败"); return; }
      await loadResults();
    }
    async function loadResults() {
      const r = await fetch("/api/results?status=" + encodeURIComponent(state.rstatus));
      const j = await r.json();
      state.results = j.items || [];
      state.rcounts = j.counts || {};
      renderResults();
    }
    $("tabResults").onclick = () => {
      $("viewResults").classList.add("on"); $("viewJobs").classList.remove("on");
      $("tabResults").classList.add("on"); $("tabJobs").classList.remove("on");
    };
    $("tabJobs").onclick = () => {
      $("viewJobs").classList.add("on"); $("viewResults").classList.remove("on");
      $("tabJobs").classList.add("on"); $("tabResults").classList.remove("on");
    };
    async function loadInspire() {
      const c = currentChar();
      const exclude = (c && c.series) || "";
      const series = $("seriesFilter").value;
      const r = await fetch("/api/inspire?exclude=" + encodeURIComponent(exclude)
        + "&series=" + encodeURIComponent(series)
        + "&vision=" + encodeURIComponent(state.vision)
        + "&limit=200");
      const j = await r.json();
      state.inspire = j.items || [];
      state.series = j.series || [];
      state.counts = j.counts || {};
      if (state.picked && !state.inspire.some((it) => it.path === state.picked.path)) {
        state.picked = state.inspire.find((it) => it.path === state.inspirePath) || null;
      }
      renderFilters();
      renderInspire();
      renderVisionPanel();
      renderBigView();
    }
    $("seriesFilter").onchange = () => loadInspire();
    $("form").onsubmit = async (e) => {
      e.preventDefault();
      if (!state.character) return alert("先选身份");
      $("btnGo").disabled = true;
      try {
        const r = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            character: state.character,
            inspire: state.inspirePath,
            pose: $("pose").value,
            style: $("style").value,
            send_inspire: $("sendInspire").checked,
            quality: $("quality").value,
            size: ($("sizeSel") || {}).value || "",
            redo_of: state.redoOf || "",
          }),
        });
        const j = await r.json();
        if (!j.ok) alert(j.error || "提交失败");
        else if (state.redoOf) {
          state.redoOf = "";
          $("redoBar").classList.remove("show");
        }
        await loadState();
        await loadResults();
      } finally {
        $("btnGo").disabled = false;
      }
    };
    loadState().then(loadInspire).then(loadResults);
    setInterval(loadState, 4000);
  </script>
</body>
</html>
